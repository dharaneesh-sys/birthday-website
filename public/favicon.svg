  <circle cx="32" cy="32" r="23" fill="none" stroke="#C8A46B" stroke-width="1" opacity="0.85"/>
  <!-- Ornamental ticks (wax-seal edge) -->
  <g stroke="#C8A46B" stroke-width="1.6" stroke-linecap="round">
    <path d="M32 3.5v3.5"/>
    <path d="M32 57v3.5"/>
    <path d="M3.5 32h3.5"/>
    <path d="M57 32h3.5"/>
    <path d="M11.9 11.9l2.5 2.5"/>
    <path d="M49.6 49.6l2.5 2.5"/>
    <path d="M52.1 11.9l-2.5 2.5"/>
    <path d="M14.4 49.6l-2.5 2.5"/>
  </g>
  <!-- Small gold diamond accents -->
  <rect x="30.7" y="10" width="2.6" height="2.6" fill="#C8A46B" transform="rotate(45 32 11.3)"/>
  <rect x="30.7" y="51.4" width="2.6" height="2.6" fill="#C8A46B" transform="rotate(45 32 52.7)"/>
  <!-- Serif 19 -->
  <text x="32" y="43.5" text-anchor="middle" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif" font-size="28" font-weight="700" fill="#A8884D">19</text>
